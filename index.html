<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Un girasol para ti 🌻</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #1b2a4a, #0a0f1f 70%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif; color: #fff; overflow: hidden;
    }
    .estrella {
      position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%;
      animation: brillar 3s infinite ease-in-out;
    }
    @keyframes brillar { 0%,100% { opacity: .2 } 50% { opacity: 1 } }

    .escena { position: relative; width: 300px; height: 460px; }

    .tallo {
      position: absolute; bottom: 0; left: 50%; width: 10px; height: 0;
      transform: translateX(-50%); background: linear-gradient(#3fa34d, #2b7a36);
      border-radius: 5px; animation: crecer 2s ease-out forwards;
    }
    @keyframes crecer { to { height: 280px; } }

    .hoja {
      position: absolute; width: 70px; height: 32px; background: #3fa34d;
      border-radius: 0 100% 0 100%; opacity: 0; animation: aparecer .8s ease-out forwards;
    }
    .hoja.izq { bottom: 90px; left: 82px; transform: rotate(-20deg); animation-delay: 1.4s; }
    .hoja.der { bottom: 150px; right: 82px; transform: scaleX(-1) rotate(-20deg); animation-delay: 1.7s; }

    .flor {
      position: absolute; top: 20px; left: 50%; width: 220px; height: 220px;
      transform: translateX(-50%) scale(0); animation: abrir 1.5s 2s cubic-bezier(.3,1.5,.5,1) forwards;
    }
    @keyframes abrir { to { transform: translateX(-50%) scale(1); } }
    .flor-giro { width: 100%; height: 100%; position: relative; animation: girar 20s 3.5s linear infinite; }
    @keyframes girar { to { transform: rotate(360deg); } }

    .petalo {
      position: absolute; top: 50%; left: 50%; width: 40px; height: 90px; margin: -90px 0 0 -20px;
      background: linear-gradient(#ffd93b, #f4a91d); border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
      transform-origin: 50% 100%;
    }
    .centro {
      position: absolute; top: 50%; left: 50%; width: 90px; height: 90px; margin: -45px 0 0 -45px;
      border-radius: 50%; background: radial-gradient(circle, #6b3e1f 0 30%, #4a2810 31% 100%);
      background-image: radial-gradient(#2e1806 2px, transparent 2.5px), radial-gradient(circle, #6b3e1f, #3b200c);
      background-size: 9px 9px, 100% 100%; box-shadow: inset 0 0 12px #000;
    }

    .mensaje {
      margin-top: 24px; text-align: center; opacity: 0; animation: aparecer 1.5s 3.5s forwards;
      padding: 0 16px;
    }
    .mensaje h1 { font-size: 2rem; color: #ffd93b; text-shadow: 0 0 12px rgba(255,217,59,.5); }
    .mensaje p { margin-top: 8px; font-size: 1.1rem; opacity: .9; }
    @keyframes aparecer { to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="escena">
    <div class="tallo"></div>
    <div class="hoja izq"></div>
    <div class="hoja der"></div>
    <div class="flor"><div class="flor-giro" id="flor"><div class="centro"></div></div></div>
  </div>

  <div class="mensaje">
    <h1>Para mi niña 🌻</h1>
    <p>Como el girasol busca al sol, yo siempre te busco a ti.</p>
  </div>

  <script>
    const flor = document.getElementById('flor');
    const centro = flor.querySelector('.centro');
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('div');
      p.className = 'petalo';
      p.style.transform = `rotate(${i * 22.5}deg)`;
      flor.insertBefore(p, centro);
    }
    for (let i = 0; i < 80; i++) {
      const s = document.createElement('div');
      s.className = 'estrella';
      s.style.top = Math.random() * 100 + 'vh';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.animationDelay = Math.random() * 3 + 's';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
